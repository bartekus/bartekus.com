name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # prebuild syncs app/data/resume.json (gitignored) from a public gist and renders the
      # PDF/DOCX from fonts vendored in app/scripts/fonts; no secrets. Build runs before
      # typecheck because app/routes/resume.tsx imports the synced resume.json.
      - run: npm run build
      - run: npm run typecheck
